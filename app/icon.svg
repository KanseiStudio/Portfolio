<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background — readable on both light and dark browser tabs -->
  <rect width="32" height="32" rx="4" fill="#0A0A0A"/>
  <!-- 6-petal flower centered at (16,16) — mirrors the brand mark -->
  <!-- Each petal: elongated ellipse offset 5.5px above center, rotated at 60° intervals.
       opacity 0.82 so overlapping regions stay natural rather than fully white. -->
  <g transform="translate(16 16)">
    <ellipse rx="3" ry="5.8" cy="-5.5" fill="white" opacity="0.82"/>
    <ellipse rx="3" ry="5.8" cy="-5.5" fill="white" opacity="0.82" transform="rotate(60)"/>
    <ellipse rx="3" ry="5.8" cy="-5.5" fill="white" opacity="0.82" transform="rotate(120)"/>
    <ellipse rx="3" ry="5.8" cy="-5.5" fill="white" opacity="0.82" transform="rotate(180)"/>
    <ellipse rx="3" ry="5.8" cy="-5.5" fill="white" opacity="0.82" transform="rotate(240)"/>
    <ellipse rx="3" ry="5.8" cy="-5.5" fill="white" opacity="0.82" transform="rotate(300)"/>
    <!-- Dark centre dot for definition at small sizes -->
    <circle r="1.8" fill="#0A0A0A"/>
  </g>
</svg>
